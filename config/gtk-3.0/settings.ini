[Settings]
# Hyprland has no XSettings daemon, so GTK3 apps (Nemo, etc.) ignore
# `gsettings` color-scheme/gtk-theme. This file is the fallback they
# actually read. The prefer-dark flag flips GTK3's built-in Adwaita
# to its dark variant without needing gnome-themes-extra.
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
