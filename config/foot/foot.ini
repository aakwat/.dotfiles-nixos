# foot — gruvbox dark hard, no transparency

font=JetBrainsMono Nerd Font:size=12
pad=8x8

[cursor]
style=beam
blink=yes

[colors]
alpha=1.0
foreground=ebdbb2
background=1d2021

selection-foreground=1d2021
selection-background=ebdbb2

regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984

bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
