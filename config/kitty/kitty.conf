# ╭───────────────────────────────────────────────────╮
# │  Kitty — transparent, Gruvbox Dark Hard           │
# │  Hyprland blurs the area behind it.               │
# ╰───────────────────────────────────────────────────╯

# Theme
include gruvbox-dark-hard.conf

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures always

# Transparency + blur
background_opacity            0.6
background_blur               1
dynamic_background_opacity    yes
confirm_os_window_close       0

# Window / chrome
window_padding_width  10
window_margin_width   0
hide_window_decorations yes
window_border_width    0
draw_minimal_borders   yes
remember_window_size   no
initial_window_width   120c
initial_window_height  32c

# Cursor
cursor_shape           beam
cursor_beam_thickness  1.6
cursor_blink_interval  0.5
cursor_trail           3
cursor_trail_decay     0.1 0.4

# Scrollback
scrollback_lines       10000

# URL / clipboard
url_style              curly
copy_on_select         no
strip_trailing_spaces  smart

# Tabs
tab_bar_edge           bottom
tab_bar_style          powerline
tab_powerline_style    slanted
tab_title_template     "{index}: {title}"

# Bell
enable_audio_bell      no
visual_bell_duration   0.1

# Performance
sync_to_monitor        yes
repaint_delay          10
input_delay            2

# Shell — `.` uses the login shell, set declaratively in
# modules/system/users.nix (pkgs.fish). Start zellij by hand when you want it.
shell                  .

# Linux-standard copy/paste (Ctrl+Shift+C/V).
# If you want macOS-style Cmd+C/V, uncomment the next two lines —
# but note your WM will fight you for Super+C.
# map super+c        copy_to_clipboard
# map super+v        paste_from_clipboard

# Tab keybinds (also Mac-ish)
map super+t        new_tab
map super+w        close_tab
map super+shift+]  next_tab
map super+shift+[  previous_tab

# Font size
map ctrl+plus      change_font_size all +1.0
map ctrl+minus     change_font_size all -1.0
map ctrl+0         change_font_size all 0
