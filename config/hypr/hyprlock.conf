# hyprlock — ly-style: terminal-login look, no date, monospace.

general {
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = true
    hide_cursor = true
    immediate_render = true
}

# Solid black, no blur — ly is a TTY, not a desktop.
background {
    monitor =
    color = rgb(0, 0, 0)
}

# Top brand line. ly shows the hostname at the top of its box.
label {
    monitor =
    text = cmd[update:0] echo "arch · $(hostname)"
    color = rgba(220, 220, 220, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# Bordered box — the ly login frame.
shape {
    monitor =
    size = 460, 180
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 1
    border_color = rgba(200, 200, 200, 1.0)
    rotate = 0
    position = 0, 0
    halign = center
    valign = center
}

# Username row (label).
label {
    monitor =
    text = login: $USER
    color = rgba(220, 220, 220, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -160, 40
    halign = center
    valign = center
}

# Password row (label) — visually paired with the input field below.
label {
    monitor =
    text = password:
    color = rgba(220, 220, 220, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -167, 0
    halign = center
    valign = center
}

# Password input — flat, no rounded box. Underscore caret feel.
input-field {
    monitor =
    size = 240, 28
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.30
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgba(220, 220, 220, 1.0)
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    position = 60, 0
    halign = center
    valign = center
}

# Failure / capslock notification line.
label {
    monitor =
    text =
    color = rgba(255, 100, 100, 1.0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
    zindex = 10
}
