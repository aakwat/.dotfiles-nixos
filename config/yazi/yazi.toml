[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 600
max_height    = 900
image_filter  = "triangle"
image_quality = 75
sixel_fraction = 15

# ── openers ─────────────────────────────────────────────────
# xdg-open routes to your preferred app per mime (image viewer,
# video player, browser, …). Edit falls back to $EDITOR / nvim.
[opener]
edit    = [{ run = 'nvim "$@"',                  desc = "nvim",         block = true,  for = "unix"  }]
open    = [{ run = 'xdg-open "$@"',              desc = "Open",         orphan = true, for = "linux" }]
extract = [{ run = 'ya pub extract --list "$@"', desc = "Extract here",                 for = "unix"  }]

[open]
rules = [
    { url = "*/",                   use = "edit"    },
    { mime = "text/*",              use = "edit"    },
    { mime = "application/json",    use = "edit"    },
    { mime = "application/x-shellscript", use = "edit" },
    { mime = "application/zip",     use = "extract" },
    { mime = "application/gzip",    use = "extract" },
    { mime = "application/x-tar",   use = "extract" },
    { mime = "application/x-7z-compressed", use = "extract" },
    { mime = "image/*",             use = "open"    },
    { mime = "video/*",             use = "open"    },
    { mime = "audio/*",             use = "open"    },
    { url = "*",                    use = "open"    },
]

