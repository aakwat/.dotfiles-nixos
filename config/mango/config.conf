# mango — https://github.com/DreamMaoMao/mango/wiki
# Ported from the previous niri config.

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
borderpx=2
bordercolor=0x504945ff
focuscolor=0x83a598ff
border_radius=6

animations=1
animation_type_open=slide
animation_type_close=slide

# Input
repeat_rate=25
repeat_delay=600
xkb_rules_layout=us,mm
xkb_rules_options=grp:ctrl_space_toggle

# Trackpad
tap_to_click=1
natural_scrolling=1
disable_while_typing=1

new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9

# ── Autostart (exec-once runs at startup, exec on reload) ─
exec-once=waybar
exec-once=mako
exec-once=hypridle
exec-once=fcitx5 -d
exec-once=nm-applet --indicator
exec-once=awww-daemon
exec-once=systemctl --user start hyprpolkitagent
exec-once=wl-paste --type text  --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=sh -c "sleep 0.5 && $HOME/.local/bin/wallpaper"

# ── Launchers ────────────────────────────────────────────
bind=SUPER,Return,spawn,foot
bind=SUPER,t,spawn,foot
bind=SUPER,e,spawn,nemo
bind=SUPER,b,spawn,librewolf
bind=SUPER,space,spawn,tofi-run --drun-print-desktop-entry=true
bind=SUPER,d,spawn,tofi-run --drun-print-desktop-entry=true
bind=SUPER,Escape,spawn,foot -T btop btop

# ── Windows ──────────────────────────────────────────────
bind=SUPER,q,killclient,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER+SHIFT,space,togglefloating,

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

bind=SUPER,Tab,focusstack,next

# ── Session ──────────────────────────────────────────────
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,e,quit,
bind=SUPER+CTRL,l,spawn,loginctl lock-session
bind=SUPER,x,spawn,sh -c $HOME/.local/bin/powermenu

# ── Scripts ──────────────────────────────────────────────
bind=SUPER+SHIFT,w,spawn,sh -c "$HOME/.local/bin/wallpaper --random"
bind=SUPER+CTRL,w,spawn,sh -c $HOME/.local/bin/wallpaper-picker
bind=NONE,Print,spawn,sh -c $HOME/.local/bin/screenshot
bind=SUPER+SHIFT,v,spawn,sh -c "cliphist list | tofi --mode dmenu | cliphist decode | wl-copy"

# ── Media / brightness ───────────────────────────────────
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause

# ── Tags ─────────────────────────────────────────────────
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
