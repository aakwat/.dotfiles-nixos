# mango — SUPER-based, tile default. Docs: https://github.com/DreamMaoMao/mango/wiki/

# Effects
blur=0
shadows=0
border_radius=6
focused_opacity=1.0
unfocused_opacity=1.0

# Animations
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
animation_duration_move=350
animation_duration_open=300
animation_duration_tag=250
animation_duration_close=400

# Scroller
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.333,0.5,0.667

# Keyboard
repeat_rate=25
repeat_delay=600
xkb_rules_layout=us,mm
xkb_rules_options=grp:ctrl_space_toggle

# Trackpad
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1

# Appearance
gappih=4
gappiv=4
gappoh=8
gappov=8
borderpx=2
no_border_when_single=1
rootcolor=0x1d2021ff
bordercolor=0x504945ff
focuscolor=0xfe8019ff
urgentcolor=0xfb4934ff

# Default layout per tag
tagrule=id:1,layout_name:grid
tagrule=id:2,layout_name:grid
tagrule=id:3,layout_name:grid
tagrule=id:4,layout_name:grid
tagrule=id:5,layout_name:grid
tagrule=id:6,layout_name:grid
tagrule=id:7,layout_name:grid
tagrule=id:8,layout_name:grid
tagrule=id:9,layout_name:grid

# Autostart lives in ~/.config/mango/autostart.sh

# Reload / quit
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,q,quit

# Apps
bind=SUPER,Return,spawn,foot
bind=SUPER,t,spawn,foot
bind=SUPER,e,spawn,nemo
bind=SUPER,b,spawn,librewolf
bind=SUPER,space,spawn,sh -c "pgrep -x tofi >/dev/null && pkill -x tofi || tofi"
bind=SUPER,d,spawn,sh -c "pgrep -x tofi >/dev/null && pkill -x tofi || tofi"
bind=SUPER,x,spawn,sh -c "$HOME/.local/bin/powermenu"
bind=SUPER,Escape,spawn,foot --title btop -e btop
bind=SUPER+CTRL,l,spawn,loginctl lock-session

# Window mgmt
bind=SUPER,q,killclient
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,f,togglefloating
bind=SUPER,a,togglegaps
bind=SUPER,0,toggleoverview

# Focus — SUPER + hjkl
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up

# Swap
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up

# Cycle
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=ALT,Tab,focusstack,next

# Workspaces (tags) 1..9
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Layout switch
bind=SUPER,n,switch_layout
bind=SUPER,r,switch_proportion_preset

# Cross-monitor (moved off SUPER+ALT so resize can use it)
bind=SUPER,bracketleft,focusmon,left
bind=SUPER,bracketright,focusmon,right
bind=SUPER+SHIFT,bracketleft,tagmon,left
bind=SUPER+SHIFT,bracketright,tagmon,right

# Resize — CTRL+SHIFT+hjkl, 40px steps
bind=CTRL+SHIFT,h,resizewin,-40,+0
bind=CTRL+SHIFT,l,resizewin,+40,+0
bind=CTRL+SHIFT,k,resizewin,+0,-40
bind=CTRL+SHIFT,j,resizewin,+0,+40

# Screenshots — grim + slurp
bind=NONE,Print,spawn,sh -c 'grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png'
bind=SHIFT,Print,spawn,sh -c 'grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png'

# Clipboard picker via tofi
bind=SUPER+SHIFT,v,spawn,sh -c 'cliphist list | tofi --mode dmenu | cliphist decode | wl-copy'

# Wallpaper
bind=SUPER+SHIFT,w,spawn,sh -c "$HOME/.local/bin/wallpaper --random"
bind=SUPER+CTRL,w,spawn,sh -c "$HOME/.local/bin/wallpaper-picker"

# Media / brightness / audio
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl play-pause

# Mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Touchpad gestures (3-finger = focus dir, 4-finger = tag/overview)
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# Scroll workspace switching
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
