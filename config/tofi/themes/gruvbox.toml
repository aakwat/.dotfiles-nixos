# tofi-rs theme — dmenu-style top bar, gruvbox-dark-hard.

[window]
anchor           = "top"
width            = "100%"
height           = 36
background_color = "#1d2021"
border_width     = 0
outline_width    = 0
corner_radius    = 0
padding_top      = 6
padding_bottom   = 6
padding_left     = 20
padding_right    = 20
clip_to_padding  = true

[results]
mode    = "horizontal"
spacing = 24
count   = 6

[prompt]
text    = "run "
padding = 8

[text]
color                 = "#7c6f64"
prompt_color          = "#928374"
input-color           = "#ebdbb2"
match_color           = "#a89984"
selection_color       = "#fbf1c7"
selection_match_color = "#00000000"

[font]
name = "JetBrainsMono Nerd Font"
size = 12
